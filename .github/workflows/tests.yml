name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      # Throwaway Postgres, the same image as docker-compose.yaml's breadsheet-db; never Neon
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: breadsheet
          POSTGRES_PASSWORD: breadsheet
          POSTGRES_DB: breadsheet_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U breadsheet -d breadsheet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://breadsheet:breadsheet@localhost:5433/breadsheet_test
      REQUIRE_TEST_DATABASE: '1'  # fail, don't skip, if Postgres isn't reachable

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'  # matches app.yaml's python314
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt

      - run: python -m pytest
