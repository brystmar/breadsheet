services:
  breadsheet-backend:
    build: ./breadsheet
    volumes:
      - ./breadsheet:/usr/src/app
    ports:
      - 5001:5001

  # Disposable Postgres for the test suite (local-only credentials); dev data lives on Neon's `dev` branch
  breadsheet-db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: breadsheet
      POSTGRES_PASSWORD: breadsheet
      POSTGRES_DB: breadsheet_test
    ports:
      - 5433:5432
    tmpfs:
      - /var/lib/postgresql
