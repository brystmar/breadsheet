services:
  breadsheet-backend:
    build: ./breadsheet
    volumes:
      - ./breadsheet:/usr/src/app
    ports:
      - 5001:5001

  breadsheet-db:
    image: amazon/dynamodb-local:3.3.2
    ports:
      - 8008:8008
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory", "-port", "8008"]
